steps:
# 1️⃣ Build de la imagen
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'us-central1-docker.pkg.dev/fiery-synthesis-472821-m2/my-repo/app-dev:latest', '.']

# 2️⃣ Push a Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-central1-docker.pkg.dev/fiery-synthesis-472821-m2/my-repo/app-dev:latest']

# 3️⃣ Deploy a App Engine Flexible
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - 'app'
    - 'deploy'
    - 'app-dev-deploy.yaml'
    - '--project=fiery-synthesis-472821-m2'
    - '--quiet'

images:
- 'us-central1-docker.pkg.dev/fiery-synthesis-472821-m2/my-repo/app-dev:latest'
